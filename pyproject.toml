[project]
name = "docs-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergei Bakin", email = "sergey.bakin2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 79
exclude = [
    ".venv",
    "venv",
    "manage.py",
    "*/migrations",
    "*/__init__.py"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-local-folder = [
    "docs_service_project",
]

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["E501"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/docs_service_project"
files = ["docs_service_project"]

[tool.django-stubs]
django_settings_module = "docs_service_project.settings"
